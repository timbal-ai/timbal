name: CI

# Two lanes, decided by the `plan` job (scripts/ci_plan.py):
# - full: every OS x Python, tests in parallel. The merge queue, manual runs, and pull requests while
#   the merge queue is not on. It is what has to pass before anything lands.
# - fast: Ubuntu + the lowest supported Python, tests in parallel. Pull requests once the repo variable
#   CI_MERGE_QUEUE=true (the merge queue then runs the full lane on what is about to land).
# A pull request that touches nothing the tests read runs no tests.
# Require only `CI result` in branch rules: it passes when every job that ran passed. (No path filter on
# the trigger: a required check from a workflow that never started would block the pull request.)

on:
  pull_request:
    branches: [main, "release/**"]  # release/** = backport PRs (RELEASING.md)
  merge_group:
  workflow_dispatch:
    inputs:
      os:
        description: OS to run on (manual runs only)
        required: false
        default: all
        type: choice
        options:
          - all
          - ubuntu-latest
          - macos-latest
          - windows-latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci_plan.py
          sparse-checkout-cone-mode: false

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MERGE_QUEUE: ${{ vars.CI_MERGE_QUEUE }}
          OS_INPUT: ${{ github.event.inputs.os }}
        run: python3 scripts/ci_plan.py >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python }})
    needs: plan
    if: needs.plan.outputs.lane != 'none'
    runs-on: ${{ matrix.os }}
    # A full run takes about 10 minutes. A hung test would otherwise hold the job for GitHub's 6 hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Install dev deps + the `all` optional-dependency group so the entire
      # import surface (server, codegen, documents, evals) is exercised on
      # every platform. This is what catches Unix-only imports like `fcntl`
      # leaking into modules that get loaded at startup on Windows.
      - name: Install dependencies
        run: uv sync --dev --extra all

      - name: Smoke import (catches platform-specific import errors)
        run: uv run python -c "import timbal; from timbal.state.tracing.providers import JsonlTracingProvider, InMemoryTracingProvider, PlatformTracingProvider, SqliteTracingProvider; print('ok')"

      - name: Audit models.yaml (offline)
        run: uv run python scripts/audit_models.py --offline

      # One worker per core; `worksteal` rebalances the few long files (the durable-session sweeps) instead
      # of leaving one worker with them at the end. One cell of the full lane measures coverage.
      - name: Run tests
        shell: bash
        env:
          COVERAGE: ${{ matrix.coverage }}
        run: |
          cov=""
          if [ "$COVERAGE" = "true" ]; then cov="--cov=timbal --cov-report=term-missing"; fi
          uv run pytest -n auto --dist worksteal $cov

  result:
    name: CI result
    needs: [plan, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          LANE: ${{ needs.plan.outputs.lane }}
          PLAN: ${{ needs.plan.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lane=$LANE plan=$PLAN test=$TEST"
          [ "$PLAN" = "success" ] || exit 1
          if [ "$LANE" = "none" ]; then exit 0; fi
          [ "$TEST" = "success" ]
