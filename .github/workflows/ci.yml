name: CI

# Two lanes, decided by the `plan` job (scripts/ci_plan.py):
# - full: every Python on Ubuntu 26.04, macOS and Windows, plus the lowest on Ubuntu 24.04; tests in parallel.
#   The merge queue, manual runs, and pull requests while the merge queue is not on. It is what has to pass
#   before anything lands.
# - fast: Ubuntu 26.04 + the lowest supported Python, tests in parallel. Pull requests into main once the repo
#   variable CI_MERGE_QUEUE=true (the merge queue then runs the full lane on what is about to land).
#   Pull requests into release/** always run the full lane: GitHub has no merge queue for a branch pattern.
# A pull request, or a merge queue group, that touches nothing the tests read runs no tests.
# Require only `CI result` in branch rules: it passes when every job that ran passed. (No path filter on
# the trigger: a required check from a workflow that never started would block the pull request.)

on:
  pull_request:
    branches: [main, "release/**"]  # release/** = backport PRs (RELEASING.md)
  merge_group:
  workflow_dispatch:
    inputs:
      os:
        description: OS to run on (manual runs only)
        required: false
        default: all
        type: choice
        options:
          - all
          - ubuntu-26.04  # scripts/ci_plan.py FULL
          - ubuntu-24.04
          - macos-latest
          - windows-latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci_plan.py
          sparse-checkout-cone-mode: false

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          REPO: ${{ github.repository }}
          MERGE_QUEUE: ${{ vars.CI_MERGE_QUEUE }}
          OS_INPUT: ${{ github.event.inputs.os }}
        run: python3 scripts/ci_plan.py >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python }})
    needs: plan
    if: needs.plan.outputs.lane != 'none'
    runs-on: ${{ matrix.os }}
    # A full run takes about 10 minutes. A hung test would otherwise hold the job for GitHub's 6 hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # The key names the runner's own Python (setup-python runs after this step), so without the matrix's
          # every job of one OS in a full run shares a key and they race to save it ("Unable to reserve cache").
          cache-suffix: py${{ matrix.python }}
          # A cache is read back only from its own ref or main's, and main runs no CI: a merge queue run's ref is
          # new each time and gone after it, so what it saved was never read (~10 MB and ~2 s per job).
          save-cache: ${{ github.event_name != 'merge_group' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Install dev deps + the `all` optional-dependency group so the entire
      # import surface (server, codegen, documents, evals) is exercised on
      # every platform. This is what catches Unix-only imports like `fcntl`
      # leaking into modules that get loaded at startup on Windows.
      - name: Install dependencies
        run: uv sync --dev --extra all

      - name: Smoke import (catches platform-specific import errors)
        run: uv run python -c "import timbal; import av, numpy; from timbal.state.tracing.providers import JsonlTracingProvider, InMemoryTracingProvider, PlatformTracingProvider, SqliteTracingProvider; print('ok', av.__version__, numpy.__version__)"

      - name: Audit models.yaml (offline)
        run: uv run python scripts/audit_models.py --offline

      # Everything in parallel, then the tests marked `serial` one at a time (today `python/tests/test_isolation.py`,
      # whose two tests must run in order in one process). Both passes always run; either failing fails the step.
      # One cell of the full lane measures coverage, over both.
      # - Workers: one per core minus one. With every core busy, the event loop, SQLite threads and background
      #   uploads starve, and that is when rare stalls showed up; a free core costs little.
      # - A failed test is retried once (pytest-rerunfailures): a rare flake does not fail the job, a real
      #   failure fails both times. Every test that passed only on retry is listed in the job summary and as a
      #   warning, so flakes stay visible and get fixed.
      - name: Run tests
        shell: bash
        env:
          COVERAGE: ${{ matrix.coverage }}
        run: |
          workers=$(uv run python -c "import os; print(max(1, (os.cpu_count() or 2) - 1))")
          cov=""
          if [ "$COVERAGE" = "true" ]; then cov="--cov=timbal --cov-report=term-missing"; fi
          # --rerun-show-tracebacks: a test that passed on retry still logs why its first attempt failed
          # (under "rerun test summary info"); without it the log has only its RERUN line.
          retry="--reruns 1 --reruns-delay 1 --rerun-show-tracebacks"
          rc=0
          uv run pytest -n "$workers" --dist worksteal -m "not integration and not serial" $retry $cov 2>&1 | tee pytest.log || rc=$?
          # Exit 5: no test marked `serial` was collected; the step does not fail for that.
          uv run pytest -m "serial and not integration" $retry $cov ${cov:+--cov-append} 2>&1 | tee -a pytest.log \
            || { s=$?; [ "$s" -eq 5 ] || rc=$s; }
          flaky=$(uv run python scripts/ci_flaky.py pytest.log)
          if [ -n "$flaky" ]; then
            echo "$flaky" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Flaky tests::$(echo "$flaky" | grep -c '^- ') test(s) passed only on retry; see the job summary"
          fi
          exit "$rc"

  result:
    name: CI result
    needs: [plan, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          LANE: ${{ needs.plan.outputs.lane }}
          PLAN: ${{ needs.plan.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lane=$LANE plan=$PLAN test=$TEST"
          [ "$PLAN" = "success" ] || exit 1
          if [ "$LANE" = "none" ]; then exit 0; fi
          [ "$TEST" = "success" ]
